# Four Host Random Blue Agent
# Randomly selects: Remove_0, Remove_1, Remove_2, Remove_3, or NoOp_0

initial_state: b0
start_host: 0

states:
  - b0
  - b0_wait_0
  - b0_wait_1
  - b0_wait_2
  - b0_wait_3
  - b0_wait_noop

transitions:
  # Random action selection from b0
  - from_state: b0
    transition: "!Blue_Remove_0"
    to_state: b0_wait_0

  - from_state: b0
    transition: "!Blue_Remove_1"
    to_state: b0_wait_1

  - from_state: b0
    transition: "!Blue_Remove_2"
    to_state: b0_wait_2

  - from_state: b0
    transition: "!Blue_Remove_3"
    to_state: b0_wait_3

  - from_state: b0
    transition: "!Blue_NoOp_0"
    to_state: b0_wait_noop

  # Remove_0 responses
  - from_state: b0_wait_0
    transition: "?success"
    to_state: b0
  - from_state: b0_wait_0
    transition: "?failure"
    to_state: b0

  # Remove_1 responses
  - from_state: b0_wait_1
    transition: "?success"
    to_state: b0
  - from_state: b0_wait_1
    transition: "?failure"
    to_state: b0

  # Remove_2 responses
  - from_state: b0_wait_2
    transition: "?success"
    to_state: b0
  - from_state: b0_wait_2
    transition: "?failure"
    to_state: b0

  # Remove_3 responses
  - from_state: b0_wait_3
    transition: "?success"
    to_state: b0
  - from_state: b0_wait_3
    transition: "?failure"
    to_state: b0

  # NoOp responses
  - from_state: b0_wait_noop
    transition: "?success"
    to_state: b0
  - from_state: b0_wait_noop
    transition: "?failure"
    to_state: b0
