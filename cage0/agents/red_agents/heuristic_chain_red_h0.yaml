# ProgressiveChainRed++ for One Host (Host_0 only)
#
# Systematic kill-chain Red agent with controlled noise on a single host.
#
# Kill chain: DRS → DNS → ERS → PE → Impact
# Policy:
# - 80% (core): Take next action in chain on Host_0
# - 10% (noise): Random valid action on Host_0
# - 10% (noise): Would switch host, but with only 1 host, stays on Host_0
#
# This agent uses Python implementation for complex probability logic.

python_agent: heuristic_chain_red_multi_host
num_hosts: 1  # Only target Host_0
