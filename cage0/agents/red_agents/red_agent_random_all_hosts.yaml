# Red Agent Logic (DFA) - Random Actions on All 4 Hosts
# Defines a random exploration strategy (sigma*) across the entire subnet
# Agent randomly selects one of 5 actions on any of 4 hosts, then returns to initial state

initial_state: s0
start_host: 0  # Red starts on Host_0

states:
  - s0              # Initial state - ready to select random action
  # Host 0 wait states
  - s0_drs_wait     # Waiting for DiscoverRemoteSystems result on Host_0
  - s0_dns_wait     # Waiting for DiscoverNetworkServices result on Host_0
  - s0_ers_wait     # Waiting for ExploitRemoteService result on Host_0
  - s0_pe_wait      # Waiting for PrivilegeEscalate result on Host_0
  - s0_impact_wait  # Waiting for Impact result on Host_0
  # Host 1 wait states
  - s1_drs_wait
  - s1_dns_wait
  - s1_ers_wait
  - s1_pe_wait
  - s1_impact_wait
  # Host 2 wait states
  - s2_drs_wait
  - s2_dns_wait
  - s2_ers_wait
  - s2_pe_wait
  - s2_impact_wait
  # Host 3 wait states
  - s3_drs_wait
  - s3_dns_wait
  - s3_ers_wait
  - s3_pe_wait
  - s3_impact_wait

transitions:
  # ========== HOST 0: Random Action Selection from s0 ==========
  - from_state: s0
    transition: "!Red_DiscoverRemoteSystems_0"
    to_state: s0_drs_wait
  - from_state: s0
    transition: "!Red_DiscoverNetworkServices_0"
    to_state: s0_dns_wait
  - from_state: s0
    transition: "!Red_ExploitRemoteService_0"
    to_state: s0_ers_wait
  - from_state: s0
    transition: "!Red_PrivilegeEscalate_0"
    to_state: s0_pe_wait
  - from_state: s0
    transition: "!Red_Impact_0"
    to_state: s0_impact_wait

  # ========== HOST 1: Random Action Selection from s0 ==========
  - from_state: s0
    transition: "!Red_DiscoverRemoteSystems_1"
    to_state: s1_drs_wait
  - from_state: s0
    transition: "!Red_DiscoverNetworkServices_1"
    to_state: s1_dns_wait
  - from_state: s0
    transition: "!Red_ExploitRemoteService_1"
    to_state: s1_ers_wait
  - from_state: s0
    transition: "!Red_PrivilegeEscalate_1"
    to_state: s1_pe_wait
  - from_state: s0
    transition: "!Red_Impact_1"
    to_state: s1_impact_wait

  # ========== HOST 2: Random Action Selection from s0 ==========
  - from_state: s0
    transition: "!Red_DiscoverRemoteSystems_2"
    to_state: s2_drs_wait
  - from_state: s0
    transition: "!Red_DiscoverNetworkServices_2"
    to_state: s2_dns_wait
  - from_state: s0
    transition: "!Red_ExploitRemoteService_2"
    to_state: s2_ers_wait
  - from_state: s0
    transition: "!Red_PrivilegeEscalate_2"
    to_state: s2_pe_wait
  - from_state: s0
    transition: "!Red_Impact_2"
    to_state: s2_impact_wait

  # ========== HOST 3: Random Action Selection from s0 ==========
  - from_state: s0
    transition: "!Red_DiscoverRemoteSystems_3"
    to_state: s3_drs_wait
  - from_state: s0
    transition: "!Red_DiscoverNetworkServices_3"
    to_state: s3_dns_wait
  - from_state: s0
    transition: "!Red_ExploitRemoteService_3"
    to_state: s3_ers_wait
  - from_state: s0
    transition: "!Red_PrivilegeEscalate_3"
    to_state: s3_pe_wait
  - from_state: s0
    transition: "!Red_Impact_3"
    to_state: s3_impact_wait

  # ========== HOST 0: Response Handling ==========
  - from_state: s0_drs_wait
    transition: "?success"
    to_state: s0
  - from_state: s0_drs_wait
    transition: "?failure"
    to_state: s0
  - from_state: s0_dns_wait
    transition: "?success"
    to_state: s0
  - from_state: s0_dns_wait
    transition: "?failure"
    to_state: s0
  - from_state: s0_ers_wait
    transition: "?success"
    to_state: s0
  - from_state: s0_ers_wait
    transition: "?failure"
    to_state: s0
  - from_state: s0_pe_wait
    transition: "?success"
    to_state: s0
  - from_state: s0_pe_wait
    transition: "?failure"
    to_state: s0
  - from_state: s0_impact_wait
    transition: "?success"
    to_state: s0
  - from_state: s0_impact_wait
    transition: "?failure"
    to_state: s0

  # ========== HOST 1: Response Handling ==========
  - from_state: s1_drs_wait
