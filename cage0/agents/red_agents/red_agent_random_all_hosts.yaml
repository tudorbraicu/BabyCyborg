  - from_state: s1_dns_wait
    transition: "?success"
    to_state: s0
  - from_state: s1_dns_wait
    transition: "?failure"
    to_state: s0
  - from_state: s1_ers_wait
    transition: "?success"
    to_state: s0
  - from_state: s1_ers_wait
    transition: "?failure"
    to_state: s0
  - from_state: s1_pe_wait
    transition: "?success"
    to_state: s0
  - from_state: s1_pe_wait
    transition: "?failure"
    to_state: s0
  - from_state: s1_impact_wait
    transition: "?success"
    to_state: s0
  - from_state: s1_impact_wait
    transition: "?failure"
    to_state: s0

  # ========== HOST 2: Response Handling ==========
  - from_state: s2_drs_wait
    transition: "?success"
    to_state: s0
  - from_state: s2_drs_wait
    transition: "?failure"
    to_state: s0
  - from_state: s2_dns_wait
    transition: "?success"
    to_state: s0
  - from_state: s2_dns_wait
    transition: "?failure"
    to_state: s0
  - from_state: s2_ers_wait
    transition: "?success"
    to_state: s0
  - from_state: s2_ers_wait
    transition: "?failure"
    to_state: s0
  - from_state: s2_pe_wait
    transition: "?success"
    to_state: s0
  - from_state: s2_pe_wait
    transition: "?failure"
    to_state: s0
  - from_state: s2_impact_wait
    transition: "?success"
    to_state: s0
  - from_state: s2_impact_wait
    transition: "?failure"
    to_state: s0

  # ========== HOST 3: Response Handling ==========
  - from_state: s3_drs_wait
    transition: "?success"
    to_state: s0
  - from_state: s3_drs_wait
    transition: "?failure"
    to_state: s0
  - from_state: s3_dns_wait
    transition: "?success"
    to_state: s0
  - from_state: s3_dns_wait
    transition: "?failure"
    to_state: s0
  - from_state: s3_ers_wait
    transition: "?success"
    to_state: s0
